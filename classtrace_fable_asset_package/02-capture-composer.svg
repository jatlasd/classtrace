<rect x="70" y="80" width="1140" height="600" rx="22" fill="#fbf7ed" stroke="#ddd0be" stroke-width="1" filter="url(#floatShadow)"/><rect x="70" y="80" width="260" height="600" rx="22" fill="#ebe3d6"/><path d="M308 80h22v600h-22z" fill="#ebe3d6"/><line x1="330" y1="80" x2="330" y2="680" stroke="#ddd0be" stroke-width="1"/><text x="112" y="138" class="body" font-size="12" font-weight="700" text-anchor="start" fill="#5d554a">QUICK CAPTURE</text><text x="112" y="190" class="display" font-size="34" font-weight="600" text-anchor="start">What happened?</text><text x="112" y="238" class="body" font-size="16" font-weight="400" fill="#5d554a"><tspan x="112" dy="0">Write the moment first.</tspan><tspan x="112" dy="24.0">Mention exactly one</tspan><tspan x="112" dy="24.0">roster student.</tspan></text><text x="382" y="142" class="body" font-size="16" font-weight="400" text-anchor="start">Use </text><text x="418" y="142" class="body" font-size="16" font-weight="700" text-anchor="start" fill="#2c526f">@student</text><text x="492" y="142" class="body" font-size="16" font-weight="400" text-anchor="start"> to name one student and </text><text x="680" y="142" class="body" font-size="16" font-weight="700" text-anchor="start" fill="#2c526f">#tag</text><text x="718" y="142" class="body" font-size="16" font-weight="400" text-anchor="start"> to add context.</text><rect x="382" y="174" width="756" height="250" rx="12" fill="#f3eadc" stroke="#ddd0be" stroke-width="1"/><text x="414" y="226" class="body" font-size="22" font-weight="450"><tspan x="414" dy="0">@stacy used her calm-down strategy on her own</tspan><tspan x="414" dy="34.1">during the math transition!! first time unprompted</tspan><tspan x="414" dy="34.1">#strategy #independence</tspan></text><rect x="414" y="366" width="92" height="34" rx="17" fill="#dce8ef" stroke="#ddd0be" stroke-width="1"/><text x="460" y="388" class="body" font-size="13" font-weight="700" text-anchor="middle" fill="#2c526f">@stacy</text><text x="382" y="461" class="body" font-size="15" font-weight="500" text-anchor="start" fill="#5d554a">Ready to capture for Stacy.</text><line x1="70" y1="518" x2="1210" y2="518" stroke="#ddd0be" stroke-width="1"/><rect x="382" y="553" width="184" height="28" rx="14" fill="#ebe3d6" stroke="#ddd0be" stroke-width="1"/><text x="474.0" y="572" class="body" font-size="12" font-weight="600" text-anchor="middle" fill="#5d554a">@ Mention one student</text><rect x="578" y="553" width="110" height="28" rx="14" fill="#ebe3d6" stroke="#ddd0be" stroke-width="1"/><text x="633.0" y="572" class="body" font-size="12" font-weight="600" text-anchor="middle" fill="#5d554a"># Add tags</text><rect x="700" y="553" width="190" height="28" rx="14" fill="#ebe3d6" stroke="#ddd0be" stroke-width="1"/><text x="795.0" y="572" class="body" font-size="12" font-weight="600" text-anchor="middle" fill="#5d554a">✓ Review before saving</text><rect x="995" y="548" width="143" height="42" rx="10" fill="#b85a32"/><text x="1066" y="575" class="body" font-size="14" font-weight="700" text-anchor="middle" fill="#fbf7ed">Capture Note</text></svg>