<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
<defs>
  <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f1911" flood-opacity=".14"/>
  </filter>
  <filter id="floatShadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1f1911" flood-opacity=".18"/>
  </filter>
  <style>
    .display { font-family: Fraunces, Georgia, serif; fill: #182536; }
    .body { font-family: Inter, Arial, sans-serif; fill: #182536; }
    .hand { font-family: Caveat, "Comic Neue", "Comic Sans MS", cursive; fill: #182536; }
    .muted { fill: #5d554a; }
    .label { font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; fill: #5d554a; }
  </style>
</defs>

<rect x="58" y="44" width="1164" height="812" rx="22" fill="#fbf7ed" stroke="#ddd0be" stroke-width="1" filter="url(#floatShadow)"/><text x="96" y="98" class="body" font-size="12" font-weight="700" text-anchor="start" fill="#5d554a">CLASSTRACE READ THIS AS</text><text x="96" y="140" class="display" font-size="30" font-weight="600" text-anchor="start">Review before saving</text><text x="96" y="174" class="body" font-size="15" font-weight="400" text-anchor="start" fill="#5d554a">The evidence note is saved exactly as shown. Structured details support searching and scanning.</text><text x="96" y="224" class="body" font-size="11" font-weight="700" text-anchor="start" fill="#5d554a">EVIDENCE NOTE</text><rect x="96" y="244" width="1088" height="136" rx="10" fill="#f3eadc" stroke="#ddd0be" stroke-width="1"/><text x="120" y="284" class="body" font-size="19" font-weight="450"><tspan x="120" dy="0">Used her calm-down strategy independently during the math transition.</tspan><tspan x="120" dy="29.45">This was the first observed unprompted use.</tspan></text><text x="96" y="414" class="body" font-size="11" font-weight="700" text-anchor="start" fill="#5d554a">STRUCTURED DETAILS</text><line x1="96" y1="430" x2="1184" y2="430" stroke="#ddd0be" stroke-width="1"/><text x="96" y="468" class="body" font-size="11" font-weight="700" text-anchor="start" fill="#5d554a">STUDENT</text><text x="96" y="502" class="body" font-size="17" font-weight="500" text-anchor="start">Stacy</text><text x="650" y="468" class="body" font-size="11" font-weight="700" text-anchor="start" fill="#5d554a">EVIDENCE TYPE</text><text x="650" y="502" class="body" font-size="17" font-weight="500" text-anchor="start">Behavior / self-regulation</text><text x="96" y="578" class="body" font-size="11" font-weight="700" text-anchor="start" fill="#5d554a">TOPIC / SKILL</text><text x="96" y="612" class="body" font-size="17" font-weight="500" text-anchor="start">Calm-down strategy</text><text x="650" y="578" class="body" font-size="11" font-weight="700" text-anchor="start" fill="#5d554a">PERFORMANCE</text><text x="650" y="612" class="body" font-size="17" font-weight="500" text-anchor="start">Independent</text><text x="96" y="688" class="body" font-size="11" font-weight="700" text-anchor="start" fill="#5d554a">TAGS</text><text x="96" y="722" class="body" font-size="17" font-weight="500" text-anchor="start">#strategy, #independence</text><text x="650" y="688" class="body" font-size="11" font-weight="700" text-anchor="start" fill="#5d554a">FOLLOW-UP</text><text x="650" y="722" class="body" font-size="17" font-weight="500" text-anchor="start">Watch for generalization across settings</text><rect x="883" y="782" width="144" height="44" rx="10" fill="#fbf7ed" stroke="#ddd0be" stroke-width="1"/><text x="955" y="810" class="body" font-size="14" font-weight="600" text-anchor="middle" fill="#182536">Edit details</text><rect x="1040" y="782" width="144" height="44" rx="10" fill="#b85a32"/><text x="1112" y="810" class="body" font-size="14" font-weight="700" text-anchor="middle" fill="#fbf7ed">Validate &amp; save</text></svg>