<text x="70" y="72" class="display" font-size="42" font-weight="600" text-anchor="start">ClassTrace × Fable asset package</text><text x="70" y="108" class="body" font-size="17" font-weight="400" text-anchor="start" fill="#5d554a">Hybrid landing direction: stylized idea → real interaction → actual product.</text><rect x="70" y="160" width="440" height="270" rx="18" fill="#fbf7ed" stroke="#ddd0be" stroke-width="1" filter="url(#paperShadow)"/><text x="98" y="200" class="body" font-size="12" font-weight="700" text-anchor="start" fill="#b85a32">01</text><text x="98" y="238" class="display" font-size="26" font-weight="600" text-anchor="start">Raw observation</text><text x="98" y="268" class="body" font-size="14" font-weight="400" text-anchor="start" fill="#5d554a">The human starting point</text><rect x="120" y="300" width="330" height="88" rx="6" fill="#f5e9c8" stroke="#ddd0be" stroke-width="1"/><line x1="144" y1="338" x2="420" y2="338" stroke="#2c526f" stroke-width="1" opacity="0.25"/><line x1="144" y1="364" x2="380" y2="364" stroke="#2c526f" stroke-width="1" opacity="0.25"/><rect x="580" y="160" width="440" height="270" rx="18" fill="#fbf7ed" stroke="#ddd0be" stroke-width="1" filter="url(#paperShadow)"/><text x="608" y="200" class="body" font-size="12" font-weight="700" text-anchor="start" fill="#b85a32">02</text><text x="608" y="238" class="display" font-size="26" font-weight="600" text-anchor="start">Capture composer</text><text x="608" y="268" class="body" font-size="14" font-weight="400" text-anchor="start" fill="#5d554a">Landing-friendly product state</text><rect x="614" y="298" width="370" height="100" rx="10" fill="#f3eadc" stroke="#ddd0be" stroke-width="1"/><rect x="614" y="298" width="90" height="100" rx="10" fill="#ebe3d6"/><line x1="704" y1="298" x2="704" y2="398" stroke="#ddd0be" stroke-width="1"/><rect x="1090" y="160" width="440" height="270" rx="18" fill="#fbf7ed" stroke="#ddd0be" stroke-width="1" filter="url(#paperShadow)"/><text x="1118" y="200" class="