l payoff</text><line x1="668" y1="634" x2="668" y2="722" stroke="#ddd0be" stroke-width="2"/><circle cx="668" cy="646" r="7" fill="#c7d4a6" stroke="#2c526f"/><rect x="692" y="646" width="270" height="22" rx="5" fill="#fbf7ed" stroke="#ddd0be" stroke-width="1"/><circle cx="668" cy="678" r="7" fill="#c7d4a6" stroke="#2c526f"/><rect x="692" y="678" width="270" height="22" rx="5" fill="#fbf7ed" stroke="#ddd0be" stroke-width="1"/><circle cx="668" cy="710" r="7" fill="#c7d4a6" stroke="#2c526f"/><rect x="692" y="710" width="270" height="22" rx="5" fill="#fbf7ed" stroke="#ddd0be" stroke-width="1"/><rect x="1090" y="490" width="440" height="270" rx="18" fill="#fbf7ed" stroke="#ddd0be" stroke-width="1" filter="url(#paperShadow)"/><text x="1118" y="530" class="body" font-size="12" font-weight="700" text-anchor="start" fill="#b85a32">06</text><text x="1118" y="568" class="display" font-size="26" font-weight="600" text-anchor="start">Full product shell</text><text x="1118" y="598" class="body" font-size="14" font-weight="400" text-anchor="start" fill="#5d554a">The realistic final reveal</text><rect x="1124" y="628" width="370" height="100" rx="10" fill="#f3eadc" stroke="#ddd0be" stroke-width="1"/><rect x="1124" y="628" width="370" height="22" rx="10" fill="#fbf7ed"/><rect x="1144" y="664" width="330" height="48" rx="8" fill="#fbf7ed" stroke="#ddd0be" stroke-width="1"/><rect x="70" y="830" width="1460" height="240" rx="18" fill="#fbf7ed" stroke="#ddd0be" stroke-width="1" filter="url(#paperShadow)"/><text x="100" y="884" class="display" font-size="28" font-weight="600" text-anchor="start">07 · Modular fragments</text><text x="100" y="918" class="body" font-size="15" font-weight="400" text-anchor="start" fill="#5d554a">Tape, chips, date stamps, hand-drawn paths, and transition labels on a transparent canvas.</text><rect x="100" y="964" width="92" height="28" rx="14" fill="#dce8ef" stroke="#ddd0be" stroke-width="1"/><text x="146.0" y="983" class="body" font-size="12" font-weight="600